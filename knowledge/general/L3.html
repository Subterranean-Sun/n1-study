<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听力 概要理解 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>听力 概要理解</h1></header><article class="doc-content analysis"><p>听完整段后，用一句话概括“说话人围绕什么问题，作出了什么判断”。例子、经历和数字常用于支持主张，概括时应说明它们共同指向的中心。</p><p>开头的设问、后段的总结和建议可以帮助判断讲述目的。选项若只覆盖一个例子，或加入音频没有表达的评价，应回到整段内容核对。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
