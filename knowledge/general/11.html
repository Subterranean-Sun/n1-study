<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双文对比 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>双文对比</h1></header><article class="doc-content analysis"><p>分别写出 A、B 两篇的讨论对象、核心主张和成立条件，再比较共同点与差异。两篇都出现同一个词，只能说明话题有联系，是否持相同观点还要看判断内容。</p><p>遇到“二者都认为”之类的选项，要分别找到两篇中的依据。若一个选项只符合其中一篇，就不能据此推断另一篇也赞同。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
