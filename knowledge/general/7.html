<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>篇章完形 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>篇章完形</h1></header><article class="doc-content analysis"><p>先通读文章，明确话题、叙述时间和作者立场。每个空格都要同时检查句内接续与句间关系，尤其留意指示词、接续词、时态和前后主语。</p><p>选项在单句中成立时，还要追问：它承接了前文哪一项信息，又怎样引出后文？表示总结、转折和举例的形式不能互换。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
