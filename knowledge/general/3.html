<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>近义替换 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>近义替换</h1></header><article class="doc-content analysis"><p>替换词应保留原句的意思、程度和说话人的态度。先用自己的话概括划线部分，再将各选项代回句子，检查语义、主语与修饰范围。</p><p>重点比较否定范围、程度强弱、动作是否持续，以及评价偏正面还是负面。词典里的近义关系只能提供线索，最终判断仍要落在题目给出的语境上。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
