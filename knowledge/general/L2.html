<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听力 ポイント理解 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>听力 ポイント理解</h1></header><article class="doc-content analysis"><p>先明确问题问的是原因、优点、差异还是最重要的一点。记录多个因素时，区分背景、附带好处与说话人着重强调的因素。</p><p>留意「何より」「一番」「決め手」「それもあるけど」等表达，以及转折之后的补充。两个人谈同一件事时，要把各自的理由分别记在姓名下面。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
