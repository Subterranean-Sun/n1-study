<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听力 即時応答 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>听力 即時応答</h1></header><article class="doc-content analysis"><p>先判断第一句话在做什么：请求、邀请、道歉、感叹、确认，还是批评。回应既要符合字面意思，也要符合双方关系和当下情境。</p><p>把否定、双重否定、反问和委婉表达听完整。例如「できなくもない」保留可能性，「〜わけにはいかない」表示受到情理或处境限制。不要听到局部肯定词就直接判为同意。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
