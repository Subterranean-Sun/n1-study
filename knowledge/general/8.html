<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>短篇阅读 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>短篇阅读</h1></header><article class="doc-content analysis"><p>先看设问，明确要找的是原因、指代、内容一致还是作者观点。随后定位原文中的依据，保留与判断有关的限定词和因果关系。</p><p>排除选项时写出它与原文的具体差异，例如扩大范围、把可能说成必然、把担心说成事实，或交换了原因与结果。短文篇幅短，结论仍应有原文依据。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
