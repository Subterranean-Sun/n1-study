<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长篇阅读Ⅰ | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>长篇阅读Ⅰ</h1></header><article class="doc-content analysis"><p>阅读时先建立文章结构，记录各段承担的作用。具体例子用来说明什么，比例子本身的细节更值得标记。</p><p>设问若涉及整篇，应把选项放回全文的论证关系中判断；若涉及局部，则回到相应段落核对。作者的让步句和转折后的主张往往承担不同作用。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
