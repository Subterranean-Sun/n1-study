<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信息检索 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>信息检索</h1></header><article class="doc-content analysis"><p>先把题目中的人物条件、日期、费用、资格和需求列成清单，再去表格或通知中查找对应规则。注意“同时满足”与“满足任一项”的区别。</p><p>涉及时间和费用时，将计算过程写出来；涉及例外时，核对脚注与补充说明。最终选项应同时符合题目条件和资料规定。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
