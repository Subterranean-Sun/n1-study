<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文脉词汇 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>文脉词汇</h1></header><article class="doc-content analysis"><p>先判断空格处需要哪种词性，再看句子的动作对象、褒贬态度和前后因果。四个词都能译成相近的中文时，要比较日语搭配，例如某个动词通常接人、事物、时间还是抽象评价。</p><p>把正确选项放回原句，检查助词和活用；再为最容易混淆的一个选项写出它自然使用的场景。这样可以区分“认识这个词”和“会在这句话里使用这个词”。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
