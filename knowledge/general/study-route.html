<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从错题回到知识点 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>从错题回到知识点</h1></header><article class="doc-content analysis"><p>先按年份和题型练习，提交后把错题归入读音、搭配、接续、指代、逻辑或听力任务判断等类别。每道错题保留原句、判断依据和最容易混淆的选项；下一轮复习时先遮住答案，再解释一次理由。</p><p>本系列按卷提供题型讲解，逐题说明与题号对应。总知识库收录词汇、语法、阅读方法和听力线索，可以用日语词形或中文释义检索。系统讲解中的原创例句、关联扩展与历年题目原文分别保留来源标记，便于回到题目核对。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
