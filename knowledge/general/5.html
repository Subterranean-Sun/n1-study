<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语法选择 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>语法选择</h1></header><article class="doc-content analysis"><p>先检查接续：前面是动词辞书形、た形、ない形，还是名词。再比较后项与前项的逻辑关系，包括理由、让步、限定、评价和说话人的判断。</p><p>表达形式相近的语法，要放在同一语境下比较。复习记录应写清“怎样接、表达什么、常与什么后项呼应”，避免只背一个中文释义。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
