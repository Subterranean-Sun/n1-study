<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听力 課題理解 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>听力 課題理解</h1></header><article class="doc-content analysis"><p>开头先确认“谁接下来做什么”，听的过程中记录执行者、已完成事项和待办事项。「もう」「済んだ」通常表示已经做过，「まず」「先に」「その前に」决定下一步的顺序。</p><p>重点跟进方案变更和最后的指令。对话里先提出的办法可能被取消；「私がやる」「〜てくれる？」「〜てもらう」则帮助确定究竟由谁执行。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
