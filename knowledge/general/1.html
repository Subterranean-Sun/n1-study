<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字读音 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>汉字读音</h1></header><article class="doc-content analysis"><p>先根据词义确定词，再检查假名中的长音、促音、浊音和拗音。不要只凭汉字的音读规律推断：同一个字进入不同词语后，读法可能发生变化。</p><p>复习时把词语、读音和一个常用搭配一起记。遇到形近词或近音词，分别写出汉字与词义；做错的读音应回到整句话中重读。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
