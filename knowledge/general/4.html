<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词汇用法 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>词汇用法</h1></header><article class="doc-content analysis"><p>从目标词的典型用法入手，依次检查词性、助词、搭配对象和语体。有些错误句的中文意思通顺，日语中却应换用另一个词。</p><p>复习时保留一条自然例句，并将错误选项改写成自然的日语。遇到自他动词、表示人或事物的名词、褒贬色彩明显的词，要单独标出使用条件。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
