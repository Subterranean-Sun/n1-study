<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语法排序 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>语法排序</h1></header><article class="doc-content analysis"><p>先把能直接连接的片段组合起来，例如名词与其修饰语、引用内容与「という」、固定句型的前后部分。随后利用句首、句尾和助词确定整句结构。</p><p>四格排完后通读完整句子，再检查 ★ 所在的格数。答题卡填写的是该格中片段的选项编号；四个片段的排列顺序与最终填写的答案需要分别核对。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
