<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听力 統合理解 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>听力 統合理解</h1></header><article class="doc-content analysis"><p>用表格或简短符号记录各个方案的条件，再分别标记每个人的需求。多人对话中，提案、保留意见和最后决定要分开记录。</p><p>同一段音频可能对应不同设问。每次回答前重新确认问的是哪位说话人、哪个时间点，以及“现在采用”还是“以后考虑”的方案。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
