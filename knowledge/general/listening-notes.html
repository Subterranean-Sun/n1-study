<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听力记录与精听复习 | N1 历年研习室</title><link rel="stylesheet" href="../../assets/style.css"></head><body><main class="document"><header class="doc-header"><a href="../../index.html">← 历年研习室</a><div class="small" style="color:#adc1b9;margin-top:20px">KNOWLEDGE / 知识讲解</div><h1>听力记录与精听复习</h1></header><article class="doc-content analysis"><p>第一遍按考试方式完成题目；第二遍听到决定答案的句子时暂停，写明执行者、对象、时间和否定范围；第三遍对照原文检查漏听。若文字稿与声音不同，以能在录音中确认的内容为依据，并保留差异记录。</p><p>听写时优先补出助词、句尾和转折表达。长名词可以帮助定位话题，最终决定答案的往往是“已经做完”“现在先做”“仍在考虑”或“由另一个人负责”等关系。</p></article></main><script>function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch(e){return;}const el=document.getElementById(id);if(el){if(el.tagName==="DETAILS")el.open=true;const parent=el.closest("details");if(parent)parent.open=true;el.scrollIntoView();}}addEventListener("hashchange",revealAnchor);revealAnchor();</script></body></html>
